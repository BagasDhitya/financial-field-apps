name: Deploy CMS to Vercel

on:
  push:
    branches: ["backend/**"]
    paths:
      - "financial-field-cms/**"
      - ".github/workflows/deploy-cms-vercel.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cms-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
