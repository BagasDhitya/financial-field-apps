name: Frontend dependency audit

# REQ-SEC-007: weekly, and whenever the lockfile changes.
on:
  schedule:
    - cron: "0 1 * * 1"
  pull_request:
    branches: [development]
    paths: ["financial-field-fe/pnpm-lock.yaml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: financial-field-fe

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Gate on what ships: production dependencies, high and critical.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Dev tooling (Lighthouse CI, linters) is reported, not gated (DSC-0012).
      - name: Audit all dependencies (report only)
        run: pnpm audit --audit-level=high
        continue-on-error: true
