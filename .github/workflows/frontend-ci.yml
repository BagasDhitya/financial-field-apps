name: Frontend CI

on:
  pull_request:
    branches: [development, staging]
    paths: ["financial-field-fe/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [development]
    paths: ["financial-field-fe/**", ".github/workflows/frontend-ci.yml"]

defaults:
  run:
    working-directory: financial-field-fe

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: financial-field-fe/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        env:
          REVALIDATE_SECRET: ci-placeholder
          PREVIEW_SECRET: ci-placeholder
          NEXT_PUBLIC_CMS_URL: http://localhost:1337
          SKIP_CMS_FETCH: "1"
        run: pnpm build

  # E2E + axe, SEO check and Lighthouse CI against a production build on the
  # mock CMS (ADR-0009, SPC-testing §3). Report-only for its first week:
  # remove `continue-on-error` once it has been stable (PRP-0002.p1.T09).
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: financial-field-fe/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E and accessibility (builds against the mock CMS)
        run: pnpm test:e2e

      - name: SEO check and Lighthouse CI
        run: |
          node scripts/with-e2e-env.mjs node tests/mock-cms/server.mjs &
          node scripts/with-e2e-env.mjs pnpm start -p 3100 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/robots.txt >/dev/null && curl -sf http://localhost:1338/api/tags >/dev/null && break
            sleep 1
          done
          pnpm seo:check
          pnpm lhci

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            financial-field-fe/playwright-report
            financial-field-fe/.lighthouseci
          retention-days: 14
