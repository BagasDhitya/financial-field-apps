name: Frontend CI

on:
  pull_request:
    branches: [development]
    paths: ["financial-field-fe/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [development]
    paths: ["financial-field-fe/**", ".github/workflows/frontend-ci.yml"]

defaults:
  run:
    working-directory: financial-field-fe

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: financial-field-fe/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          REVALIDATE_SECRET: ci-placeholder
          PREVIEW_SECRET: ci-placeholder
          NEXT_PUBLIC_CMS_URL: http://localhost:1337
          SKIP_CMS_FETCH: "1"
        run: pnpm build