name: AI PR Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - development
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR metadata and diff
        id: pr_context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUM="$PR_NUMBER_INPUT"
            PR_JSON=$(gh pr view "$PR_NUM" --json number,title,body,baseRefName,headRefName)
            BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.baseRefName')
            HEAD_BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
            PR_BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
          else
            PR_NUM="$PR_NUMBER_EVENT"
            BASE_BRANCH="${BASE_REF:-development}"
            HEAD_BRANCH="${HEAD_REF:-}"
            PR_TITLE=$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")
            PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          fi

          git fetch origin "$BASE_BRANCH" --depth=1 || true
          if [ -n "$HEAD_BRANCH" ]; then
            git fetch origin "$HEAD_BRANCH" --depth=1 || true
          fi

          DIFF_OUTPUT=$(git diff "origin/$BASE_BRANCH...HEAD" -- \
            'financial-field-cms/**' \
            'financial-field-fe/**' \
            'src/**' \
            ':!**/package-lock.json' \
            ':!**/pnpm-lock.yaml' \
            ':!**/yarn.lock' || true)

          if [ -z "$DIFF_OUTPUT" ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAX_CHARS=45000
          if [ "${#DIFF_OUTPUT}" -gt "$MAX_CHARS" ]; then
            DIFF_OUTPUT="${DIFF_OUTPUT:0:$MAX_CHARS}"$'\n\n[Diff truncated due to size limit]'
          fi

          jq -n \
            --arg pr_num "$PR_NUM" \
            --arg base "$BASE_BRANCH" \
            --arg head "$HEAD_BRANCH" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg diff "$DIFF_OUTPUT" \
            '{
              pr_number: ($pr_num | tonumber),
              base_branch: $base,
              head_branch: $head,
              title: $title,
              body: $body,
              diff: $diff
            }' > /tmp/pr_payload.json

          echo "has_diff=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Run AI code review with model fallback
        if: steps.pr_context.outputs.has_diff == 'true'
        id: ai_review
        env:
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          REQUESTY_BASE_URL: ${{ secrets.REQUESTY_BASE_URL }}
        run: |
          set -euo pipefail

          BASE_URL="${REQUESTY_BASE_URL:-https://router.requesty.ai/v1}"

          MODELS=(
            "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
            "novita/ling-3.1-flash"
            "nvidia/nemotron-3.5-lightning-30b-a3b"
            "nvidia/nemotron-3-ultra-550b-a55b"
            "google/gemma-4-31b-it"
          )

          SYSTEM_PROMPT=$(cat <<'EOF'
          You are a pragmatic Senior Full-Stack & Frontend Code Reviewer for "Financial Field Indonesia" (a news portal and financial education platform built with Next.js App Router, TypeScript, and a Headless CMS).

          Review ONLY the provided git diff and focus on high-signal issues:
          1. Frontend <-> CMS Integration Standards:
             - CMS API calls must go through a centralized service/fetcher layer rather than raw `fetch()` calls scattered inside pages or UI components.
             - Avoid broad/unbounded `populate=*` queries where explicit fields/relations are appropriate.
             - Enforce null/undefined safety and fallbacks for CMS fields/relations/media (e.g., cover images, authors, categories, optional fields) so missing CMS content does not crash rendering.
             - Ensure private CMS API tokens/secrets are never exposed on the client (e.g., via `NEXT_PUBLIC_`).
          2. Caching Standardization:
             - Check whether caching/revalidation follows consistent patterns (`revalidate`, cache tags, or shared fetch helpers) instead of ad-hoc `cache: 'no-store'` or inconsistent caching without clear justification.
          3. Next.js / News & Financial Education Quality:
             - Flag unnecessary `'use client'` boundaries on components that can stay Server Components (important for SEO/GEO and performance).
             - Check error/loading handling, hardcoded URLs/secrets, and obvious runtime bugs.

          Output rules:
          - Write clear, concise English.
          - Do NOT nitpick formatting or code style.
          - Structure the review into at most three sections:
            ### 🔴 Critical
            ### 🟡 Suggestions
            ### ✅ Good Catch
          - If no issues are found in a section, write "None." under that heading.
          EOF
          )

          PR_TITLE=$(jq -r '.title' /tmp/pr_payload.json)
          HEAD_BRANCH=$(jq -r '.head_branch' /tmp/pr_payload.json)
          BASE_BRANCH=$(jq -r '.base_branch' /tmp/pr_payload.json)
          PR_BODY=$(jq -r '.body' /tmp/pr_payload.json)
          PR_DIFF=$(jq -r '.diff' /tmp/pr_payload.json)

          USER_PROMPT=$(printf 'PR Title: %s\nBranch: %s -> %s\nPR Description:\n%s\n\nGit Diff:\n```diff\n%s\n```' \
            "$PR_TITLE" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_BODY" "$PR_DIFF")

          REVIEW_TEXT=""
          USED_MODEL=""

          for MODEL in "${MODELS[@]}"; do
            echo "Attempting review with model: $MODEL"
            REQ_BODY=$(jq -n \
              --arg model "$MODEL" \
              --arg sys "$SYSTEM_PROMPT" \
              --arg usr "$USER_PROMPT" \
              '{
                model: $model,
                temperature: 0.2,
                messages: [
                  { role: "system", content: $sys },
                  { role: "user", content: $usr }
                ]
              }')

            HTTP_CODE=$(curl -sS -o /tmp/requesty_resp.json -w "%{http_code}" \
              -X POST "${BASE_URL%/}/chat/completions" \
              -H "Authorization: Bearer ${REQUESTY_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$REQ_BODY" || true)

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/requesty_resp.json)
              if [ -n "$CONTENT" ]; then
                REVIEW_TEXT="$CONTENT"
                USED_MODEL="$MODEL"
                echo "Success with model: $MODEL"
                break
              fi
            fi

            ERR_MSG=$(jq -r '.error.message // .message // "Unknown error"' /tmp/requesty_resp.json 2>/dev/null || echo "Request failed")
            echo "Model $MODEL failed (HTTP $HTTP_CODE): $ERR_MSG"
          done

          if [ -z "$REVIEW_TEXT" ]; then
            echo "All configured fallback models failed." >&2
            exit 1
          fi

          jq -n \
            --arg model "$USED_MODEL" \
            --arg body "$REVIEW_TEXT" \
            '{ model: $model, body: $body }' > /tmp/review_result.json

      - name: Upsert review comment on Pull Request
        if: steps.pr_context.outputs.has_diff == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr_context.outputs.pr_number }}
        run: |
          set -euo pipefail

          MODEL_USED=$(jq -r '.model' /tmp/review_result.json)
          REVIEW_BODY=$(jq -r '.body' /tmp/review_result.json)
          MARKER="<!-- ai-pr-reviewer-bot -->"

          FINAL_COMMENT=$(cat <<EOF
          ${MARKER}
          ## 🤖 AI PR Code Review

          ${REVIEW_BODY}

          ---
          <sub>Reviewed via Requesty AI using model \`${MODEL_USED}\` • Advisory check only (does not block merge)</sub>
          EOF
          )

          EXISTING_COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -n 1 || true)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments/${EXISTING_COMMENT_ID}" \
              -X PATCH \
              -f body="$FINAL_COMMENT" > /dev/null
            echo "Updated existing review comment #$EXISTING_COMMENT_ID"
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -X POST \
              -f body="$FINAL_COMMENT" > /dev/null
            echo "Created new review comment on PR #$PR_NUMBER"
          fi
