name: Deploy CMS to Dokploy (Development)

on:
  push:
    branches:
      - "development"
    paths:
      - "financial-field-cms/**"
      - ".github/workflows/cms-dokploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cms-dokploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Point Dokploy to target branch and deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          BODY=$(jq -n \
            --arg id "$APPLICATION_ID" \
            --arg branch "$BRANCH" \
            '{
              applicationId: $id,
              customGitUrl: "https://github.com/BagasDhitya/financial-field-apps",
              customGitBranch: $branch,
              customGitBuildPath: "/financial-field-cms",
              watchPaths: [],
              enableSubmodules: false
            }')

          echo "Setting Dokploy branch to: $BRANCH"
          curl -sS -f -X POST "$DOKPLOY_URL/api/application.saveGitProvider" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "$BODY"
          echo ""

          echo "Triggering deployment..."
          curl -sS -f -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "$(jq -n --arg id "$APPLICATION_ID" '{applicationId: $id}')"
          echo ""
          echo "Deployment triggered for branch: $BRANCH"
